<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html
  dir="ltr"
  xmlns="http://www.w3.org/1999/xhtml"
  xmlns:o="urn:schemas-microsoft-com:office:office"
>
  <head>
    <meta charset="UTF-8" />
    <meta content="width=device-width, initial-scale=1" name="viewport" />
    <meta name="x-apple-disable-message-reformatting" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta content="telephone=no" name="format-detection" />
    <title></title>
  </head>
  <body>
    <table
      align="center"
      cellpadding="15"
      cellspacing="0"
      width="100%"
      style="
        font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        border: 3px solid #242e3e;
        border-radius: 30px;
        text-align: center;
        max-width: 600px;
        margin: 0 auto;
        overflow: hidden;
      "
    >
      <tr>
        <td style="background-color: #242e3e; color: white">
          <h1 style="margin: 0">
            <strong>Help us protect your account</strong>
          </h1>
        </td>
      </tr>
      <tr>
        <td style="padding: 20px">
          <p style="font-size: 16px">
            Before you sign in, we need to verify your identity.
          </p>
          <h3 style="margin: 20px 0; color: #242e3e">
            For verifying, follow the
            <strong
              ><a
                href="${VERIFICATION_LINK}"
                style="color: #242e3e; text-decoration: none; font-weight: 900"
                >link</a
              ></strong
            >
          </h3>
        </td>
      </tr>
    </table>
  </body>
</html>
